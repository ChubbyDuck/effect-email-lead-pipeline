packages:
  - 'apps/*'
  - 'packages/*'
  - 'iac/*'
  - 'tools/*'
  - 'e2e'
catalog:
  '@aws-sdk/client-appconfig': ^3.1171.0
  '@aws-sdk/client-appconfigdata': ^3.1171.0
  '@aws-sdk/client-cloudformation': ^3.1171.0
  '@aws-sdk/client-cloudwatch': ^3.1171.0
  '@aws-sdk/client-cloudwatch-logs': ^3.1171.0
  '@aws-sdk/client-dynamodb': ^3.1171.0
  '@aws-sdk/client-lambda': ^3.1171.0
  '@aws-sdk/client-s3': ^3.1171.0
  '@aws-sdk/client-sqs': ^3.1171.0
  '@aws-sdk/lib-dynamodb': ^3.1171.0
  '@types/node': ^26.6.6
  effect: 4.1.4
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 7.0.2
  vite: ^8.3.8
  vitest: ^5.1.1
overrides:
  # The UI kit and the web apps need one physical copy of React.
  react: 19.3.1
  react-dom: 19.3.1
  # Fixed versions of transitive packages with advisories (pnpm audit).
  happy-dom: ^21.0.4
  rollup: ^4.59.0
  esbuild: ^0.28.1
  source-map-js: ^1.2.2
  seroval: ^1.6.11
  seroval-plugins: ^1.6.11
allowBuilds:
  bufferutil: false
  esbuild: true
  utf-8-validate: false
  workerd: false
minimumReleaseAgeExclude:
  - cn@0.4.0
  - effect@4.1.4
